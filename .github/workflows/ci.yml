name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt · clippy · check · test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pina o canal, os componentes e o alvo msvc
      - name: Show toolchain
        run: |
          rustup show
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Check
        run: cargo check --all-targets --target x86_64-pc-windows-msvc

      # Com `--target` o grafo de dependências é um só: sem ele o cargo
      # compilava tudo de novo em `target/debug` só para os testes.
      - name: Test
        run: cargo test --target x86_64-pc-windows-msvc

      # O `check` acima nunca chega no linker, e é lá que aparecem os erros que
      # só o perfil de release tem (LTO, `panic = "abort"`, recursos do
      # `build.rs`). É esse binário que o instalador empacota no release.
      - name: Release build
        run: cargo build --release --target x86_64-pc-windows-msvc
