[package]
name = "macro-helldivers2"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
description = "Ferramenta de macros otimizada para Helldivers 2"
authors = ["DionathaGoulart"]
license = "MIT"
repository = "https://github.com/DionathaGoulart/Macro-Helldivers2"
publish = false

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.16"
directories = "6.0.0"
# Sem features padrão: o app não tem console em release, então cor de terminal e
# formatação de timestamp (regex + jiff) só engordariam o binário.
env_logger = { version = "0.11.11", default-features = false }
# Só os dois formatos que existem em `assets/icons/`: WebP para os ícones do jogo
# e PNG para o ícone do app. Cada formato extra é um decodificador a mais no exe.
image = { version = "0.25.9", default-features = false, features = ["webp", "png"] }
log = "0.4.34"
rand = "0.10.2"
# Ordena versões com pré-lançamento do jeito que o Cargo ordena: sem isso o
# "2.0.0-beta.1" de um release de teste pareceria mais novo que o "2.0.0" final.
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Dorme no relógio do SO até onde ele é confiável e gira o resto: é o que segura
# o desvio das esperas do engine abaixo de 1ms.
spin_sleep = "1.3.3"
# Cliente HTTP bloqueante para as estatísticas da comunidade: três GETs num
# worker efêmero não pagam um runtime assíncrono. TLS pelo `native-tls`, que no
# Windows é o Schannel do próprio sistema — o rustls padrão arrastaria o `ring`,
# com criptografia em C que precisa de um compilador C até para o `cargo check`
# do alvo Windows a partir do macOS.
ureq = { version = "3.4.0", default-features = false, features = ["json", "native-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
# `Vector2`/`Matrix3x2` das assinaturas do Direct2D moram aqui: a crate `windows`
# referencia os tipos, mas não os reexporta.
windows-numerics = "0.3.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Só em release: os guards RAII do engine dependem de unwind para soltar as teclas
# em caso de panic, e os testes de lógica precisam de unwind para rodar.
panic = "abort"

[build-dependencies]
# Gera o `.rc` com ícone e manifesto e chama o compilador de recursos. Só faz
# algo quando o alvo é Windows; fora dele o `build.rs` sai antes.
winresource = "0.1.31"
