[package]
name = "macro-helldivers2"
version = "2.0.0-dev"
edition = "2021"
rust-version = "1.85"
description = "Ferramenta de macros otimizada para Helldivers 2"
authors = ["DionathaGoulart"]
license = "MIT"
repository = "https://github.com/DionathaGoulart/Macro-Helldivers2"
publish = false

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.16"
directories = "6.0.0"
# Sem features padrão: o app não tem console em release, então cor de terminal e
# formatação de timestamp (regex + jiff) só engordariam o binário.
env_logger = { version = "0.11.11", default-features = false }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Dorme no relógio do SO até onde ele é confiável e gira o resto: é o que segura
# o desvio das esperas do engine abaixo de 1ms.
spin_sleep = "1.3.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Media",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Só em release: os guards RAII do engine dependem de unwind para soltar as teclas
# em caso de panic, e os testes de lógica precisam de unwind para rodar.
panic = "abort"
